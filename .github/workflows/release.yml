name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps for sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install openvino openvino-genai openvino-tokenizers fastapi uvicorn pydantic pyinstaller

      - name: Build sidecar
        shell: pwsh
        env:
          LEGAMIND_PYTHON: python
        run: ./build-sidecar.ps1

      - name: Frontend deps
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Legamind ${{ github.ref_name }}"
          releaseBody: "MSI без код-сигнинга: SmartScreen может показать предупреждение. Проверьте контрольную сумму."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ""

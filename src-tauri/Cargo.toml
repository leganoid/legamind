[package]
name = "legamind"
version = "0.1.0"
description = "Legamind — локальные и облачные модели в одном нативном окне"
authors = ["Legamind"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "legamind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
similar = "2.7.0"
notify = "8.2.0"
pdf-extract = "0.12.1"
ignore = "0.4.30"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "minwindef", "winbase"] }

[profile.dev]
# Отладочная информация C-кода (cc/ring/sqlite) на этой сборке MSVC даёт ошибку D8050.
# Для отладки Rust это не критично; при необходимости включите debug = 1.
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
